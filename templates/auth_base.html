<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Bedrock Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body class="auth-body">
  <main class="auth-card">
    <a class="brand auth-brand" href="{{ url_for('index') }}" aria-label="Bedrock Chat home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>
      </span>
      <span class="brand-name">Bedrock Chat</span>
    </a>
    <h1 class="auth-title">{% block heading %}{% endblock %}</h1>
    <p class="auth-sub">{% block subheading %}{% endblock %}</p>

    {% if error %}
    <div class="banner auth-error" role="alert"><span>{{ error }}</span></div>
    {% endif %}

    {% block form %}{% endblock %}

    <p class="auth-switch">{% block switch %}{% endblock %}</p>
  </main>
</body>
</html>
