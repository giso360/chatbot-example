{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block heading %}Welcome back{% endblock %}
{% block subheading %}Log in to pick up your conversations.{% endblock %}

{% block form %}
<form class="auth-form" method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next_url }}">

  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required {% if not email %}autofocus{% endif %}>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required {% if email %}autofocus{% endif %}>

  <button class="auth-submit" type="submit">Log in</button>
</form>
{% endblock %}

{% block switch %}New here? <a href="{{ url_for('signup', next=next_url or None) }}">Create an account</a>{% endblock %}
