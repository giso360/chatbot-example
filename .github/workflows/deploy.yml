name: Deploy to EC2

# Every push to master rebuilds the image and replaces the running container.
#
# This job runs on a self-hosted runner installed ON the EC2 instance, so it needs no secrets:
# no AWS keys (Bedrock access comes from the instance's IAM role), no SSH key, no registry login.
# Runner setup (one time): see .github/DEPLOY_SETUP.md
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", ".gitignore"]
  workflow_dispatch:

# Never run two deployments at once; a newer push waits for the running one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, bedrock-chat]
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image and replace the container
        run: bash scripts/deploy-local.sh "${{ github.sha }}"
